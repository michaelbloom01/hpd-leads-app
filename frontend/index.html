    <script>
      tailwind.config = {
        darkMode: 'class',

            fontFamily: {

    <style>
      body {
        background-color: #030712;
        color: #f9fafb;
        -webkit-font-smoothing: antialiased;
      }
      /* Elite Terminal Scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #030712;
      }
      ::-webkit-scrollbar-thumb {
        background: #1f2937;
        border-radius: 10px;
        border: 2px solid #030712;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3b82f6;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      
      .glass {
        background: rgba(17, 24, 39, 0.7);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      /* Map Filter for Dark Mode Aesthetic */
      .map-dark {
        filter: invert(90%) hue-rotate(180deg) contrast(1.2) brightness(0.9) saturate(0.5);
      }
