# Scoring Configuration V3
# Focused on: condo/co-op concentration, density, 50-300 unit sweet spot,
# Manhattan preference, professional management, and contactability.
# Single unified mode (no V1/V2 split).

# Weights (must sum to 1.0)
weights:
  condo_coop: 0.35        # % of portfolio that is condo or co-op (dominant factor)
  density: 0.20           # Unit-to-building ratio, ideal > 15
  units: 0.15             # Total units, sweet spot 50-300
  location: 0.10          # Manhattan bonus
  professional: 0.10      # Entity type, corporate indicators
  contact: 0.10           # Phone/email/website completeness

# Hard filter: leads with fewer than this many units get score = 0
min_units_threshold: 10

# Condo/co-op scoring: % of buildings that are condo or co-op
condo_coop_thresholds:
  tier_100: 0.80   # >= 80% condo/co-op = 100 points
  tier_85: 0.60    # >= 60% = 85 points
  tier_65: 0.40    # >= 40% = 65 points
  tier_40: 0.20    # >= 20% = 40 points
  tier_20: 0.01    # > 0% = 20 points
  # 0% = 0 points

# Density scoring: total_units / portfolio_size
density_thresholds:
  tier_100: 20     # >= 20 units/bldg = 100 points
  tier_90: 15      # >= 15 = 90 points (ideal threshold)
  tier_60: 10      # >= 10 = 60 points
  tier_30: 5       # >= 5 = 30 points
  # < 5 = 10 points

# Unit count scoring: sweet spot 50-300
unit_sweet_spot:
  min: 50          # Lower bound of ideal range
  max: 300         # Upper bound of ideal range
  close_low: 30    # Close below ideal
  close_high: 500  # Close above ideal
  viable_low: 10   # Minimum viable (below = hard filter)
  viable_high: 1000 # Upper viable

# Location scoring
location_scores:
  manhattan: 100
  default: 50      # All other boroughs

# Keywords indicating professional management
professional_keywords:
  - management
  - mgmt
  - property
  - realty
  - holdings
  - associates
  - partners
  - group
  - capital
  - investments

# Score tier labels
tier_labels:
  A: "Top Tier"      # 80-100
  B: "Strong"        # 60-79
  C: "Moderate"      # 40-59
  D: "Low Priority"  # 20-39
  F: "Minimal"       # 0-19

# Minimum score to include in output (set to 0 for all)
min_score_threshold: 0
