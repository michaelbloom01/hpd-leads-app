version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-data:/app/data
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
      - DATABASE_PATH=/app/data/leads.db
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    restart: unless-stopped

volumes:
  backend-data:
